name: Build Mainline Debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build mainline debug APK
        run: ./gradlew assembleMainlineDebug --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK_PATH="$(find app/build/outputs/apk/mainline/debug -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "No APK found" >&2
            exit 1
          fi
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK_PATH")" >> "$GITHUB_OUTPUT"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Create release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}-${{ github.sha }}
          name: APK build ${{ github.run_number }} (${{ github.ref_name }})
          body: |
            Automated debug APK build.

            - Branch: `${{ github.ref_name }}`
            - Commit: `${{ github.sha }}`
            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Download the `.apk` asset below and tap it on your Android phone to install.
          prerelease: true
          files: ${{ steps.apk.outputs.path }}
